# Include INSIDE the existing HTTPS server block; keep Rails/Passenger locations.
# This snippet does not replace the application's nginx configuration.
location = /mcp {
  client_max_body_size 32k;
  proxy_pass http://127.0.0.1:3101;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
}
location = /.well-known/oauth-protected-resource/mcp {
  proxy_pass http://127.0.0.1:3101;
  proxy_set_header Host $host;
}
location = /.well-known/oauth-protected-resource {
  proxy_pass http://127.0.0.1:3101;
  proxy_set_header Host $host;
}
location = /mcp/health {
  proxy_pass http://127.0.0.1:3101/health;
  proxy_set_header Host $host;
}
# /mcp/oauth/*, /mcp/ais/* and /.well-known/oauth-authorization-server
# must continue to reach Rails. Never proxy all /mcp/* to Node (recursion).
# Preserve Authorization for Rails and do not log its value or tool bodies.
