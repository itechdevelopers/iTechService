ru:
  green_api_instances:
    link: Мессенджеры (GREEN-API)
    connected: Инстанс подключён.
    webhook_flash:
      already: Уведомления уже идут в Айс.
      applied: GREEN-API применит настройки уведомлений в течение 5 минут и перезапустит инстанс — на это время сообщения задержатся.
      failed: "Направить уведомления в Айс не удалось: %{error}. Нажмите «Направить уведомления в Айс» ещё раз."
    index:
      title: Мессенджеры для диалогов с клиентами
      description: >-
        Инстансы GREEN-API, через которые клиенты пишут компании в мессенджеры по
        номеру телефона. Реквизиты — в личном кабинете GREEN-API, на странице инстанса.
      source: Реквизиты
      sources:
        db: введены в Айсе
        env: из окружения сервера
        none: не заданы
      updated: "(изменены %{time}, %{user})"
      unreadable: Токены не читаются — сменился ключ приложения. Введите реквизиты заново.
      state: Состояние
      checking: проверяю…
      connect: Подключить инстанс
      change: Сменить инстанс или реквизиты
      import_env: Перенести реквизиты в Айс
      import_env_confirm: >-
        Реквизиты из окружения сервера сохранятся в Айсе, и дальше канал будет брать
        их отсюда. Инстанс перенастраивать не придётся. Продолжить?
      configure: Направить уведомления в Айс
      configure_confirm: >-
        Если уведомления идут не в Айс, GREEN-API применит новые настройки в течение
        5 минут и перезапустит инстанс — на это время сообщения задержатся. Продолжить?
    status:
      unreachable: GREEN-API не ответил
      phone: "номер +%{phone}"
      suspended_until: "до %{time}"
      states:
        authorized: аккаунт подключён
        notAuthorized: не авторизован — нужно отсканировать QR-код
        blocked: аккаунт заблокирован мессенджером
        sleepMode: спящий режим — телефон с аккаунтом не в сети
        starting: инстанс запускается (до 5 минут)
        suspended: отправка временно ограничена мессенджером
        yellowCard: отправка временно ограничена мессенджером
        pendingPassword: ждёт облачный пароль аккаунта
      webhook:
        ours: уведомления идут в Айс
        token: адрес Айса, но токен другой — нажмите «Направить уведомления в Айс»
        elsewhere: "уведомления идут на другой адрес: %{url}"
        "off": уведомления выключены
        unknown: настройки уведомлений не прочитались
        no_host: не задан SERVER_HOST — адрес Айса для уведомлений неизвестен
      show_qr: Показать QR-код для входа
      qr_hint: >-
        Отсканируйте код телефоном, на котором открыт аккаунт, — в разделе связанных
        устройств приложения мессенджера. Код обновляется сам.
      qr_expired: Код больше не обновляется — обновите страницу, чтобы показать новый.
      qr_failed: Не удалось получить код — GREEN-API не ответил.
      password_placeholder: облачный пароль MAX
      password_submit: Отправить пароль
      logout: Выйти из аккаунта
      logout_confirm: >-
        Аккаунт отключится от инстанса, и сообщения клиентов перестанут приходить в Айс,
        пока его не подключат снова по QR-коду. Выйти?
      reboot: Перезапустить инстанс
      reboot_confirm: Инстанс перезапустится — до 5 минут сообщения будут задерживаться. Перезапустить?
    qr:
      authorized: Аккаунт подключён.
      passkey: >-
        Мессенджер просит подтвердить вход ключом доступа (passkey). Это делается в личном
        кабинете GREEN-API — из Айса не получится.
    logout:
      done: Аккаунт отключён. Чтобы подключить его снова, покажите QR-код.
      failed: "Выйти не удалось: %{error}"
    reboot:
      done: Инстанс перезапускается — это займёт до 5 минут.
      failed: "Перезапустить не удалось: %{error}"
    password:
      accepted: Пароль принят — аккаунт подключается.
      failed: "Пароль не принят: %{error}"
      reasons:
        invalid_password: неверный пароль
        rate_limit_exceeded: слишком много попыток — подождите и попробуйте снова
        attempts_exceeded: попытки ввода пароля закончились — начните вход заново с QR-кода
        authorization_not_started: сначала отсканируйте QR-код
        time_limit_expired_logout: время на ввод пароля истекло — начните вход заново с QR-кода
        timeout: MAX не ответил — попробуйте ещё раз
        already_registered: аккаунт уже подключён
    edit:
      title: "%{channel}: инстанс GREEN-API"
      hint: >-
        Все четыре значения — в личном кабинете GREEN-API на странице инстанса. При
        сохранении Айс проверит их у GREEN-API и сам направит уведомления инстанса в Айс.
      replace_warning: >-
        Если указать другой инстанс, переписка продолжится с его номера: клиенты увидят
        ответы от нового номера, а прежний инстанс перестанет присылать сообщения в Айс.
      token_keep: Оставьте пустым, чтобы не менять
      save: Сохранить и подключить
      saving: Проверяю реквизиты…
    update:
      rejected: "GREEN-API не принял реквизиты: %{error}"
    import_env:
      failed: "Перенести реквизиты не удалось: %{error}"
  activerecord:
    models:
      green_api_instance: Инстанс GREEN-API
    attributes:
      green_api_instance:
        channel: Канал
        api_url: apiUrl
        media_url: mediaUrl
        id_instance: idInstance
        api_token: apiTokenInstance
