ru:
  client_chat_starts:
    messengers:
      max_phone: MAX
      whatsapp: WhatsApp
    form:
      title: Написать клиенту в %{messenger}
      phone: 'Номер:'
      found_named: 'Номер найден в %{messenger}: «%{name}». Проверьте, что это ваш клиент.'
      found_unnamed:
        max_phone: Номер найден в MAX.
        whatsapp: >-
          Номер есть в WhatsApp. Имя профиля WhatsApp не показывает, пока человек вам не
          писал, — проверьте, что номер в карточке клиента актуален.
      hint:
        whatsapp: >-
          WhatsApp строже к сообщениям, на которые не отвечают: задайте в сообщении вопрос,
          чтобы клиент ответил.
      placeholder: Сообщение клиенту…
      send: Отправить
      sending: Отправляем…
      empty_body: Сообщение пустое — писать нечего.
      not_found: На этом номере нет аккаунта %{messenger}.
      not_found_on: 'На этом номере нет аккаунта %{messenger} (проверено %{date}).'
      paused: '%{messenger} временно ограничил проверку номеров. Попробуйте после %{time}.'
      not_configured: Канал «%{channel}» не настроен — написать нельзя.
      invalid_phone: У клиента нет номера телефона в международном формате.
      error: Не удалось проверить номер в %{messenger}. Попробуйте чуть позже.
      limit_reached: 'За последние сутки начато уже %{limit} новых диалогов в %{messenger} — это лимит из параметров. Новый диалог можно будет начать позже.'
      limit_zero: Начинать новые диалоги в %{messenger} сейчас нельзя — в параметрах лимит 0.
