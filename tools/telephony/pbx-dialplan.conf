; Production Asterisk 11, append to extensions_custom.conf after review.
; Replace the existing ais-pilot-browser context, do not duplicate it.
[ais-pilot-browser]
exten => _777[1-9],1,Goto(ais-browser-parallel,${EXTEN},1)
exten => 7780,1,Goto(ais-browser-parallel,${EXTEN},1)
[ais-browser-parallel]
exten => _XXXX,1,SIPAddHeader(X-AIS-Call-ID: ${CHANNEL(linkedid)})
 same => n,Dial(SIP/ais-pilot-bridge/${EXTEN},120)
 same => n,Hangup()

; Change ONLY the ais-pilot-bridge peer context to from-ais-browser.
; Routing and trunk selection continue to be decided by production FreePBX.
[from-ais-browser]
exten => _XXX,1,Goto(ais-browser-authorized,${EXTEN},1)
exten => _XXXX,1,Goto(ais-browser-authorized,${EXTEN},1)
exten => _7XXXXXXXXXX,1,Goto(ais-browser-authorized,${EXTEN},1)
[ais-browser-authorized]
exten => _X!,1,GotoIf($[${REGEX("^(777[1-9]|7780)$" ${CALLERID(num)})}]?allowed:blocked)
 same => n(allowed),Goto(from-internal,${EXTEN},1)
 same => n(blocked),Hangup(21)
