; Asterisk 20 local gateway, installed after review
[from-pbx-pilot]
; Existing parallel route 7771 is the shared browser group for 101/102/103.
exten => 7771,1,Goto(ais-browser-group,7771,1)
exten => _777[2-9],1,Goto(ais-browser-incoming,${EXTEN},1)
exten => 7780,1,Goto(ais-browser-incoming,${EXTEN},1)

[ais-browser-call-id]
exten => s,1,Set(AIS_CALL_ID=${FILTER(0-9.,${PJSIP_HEADER(read,X-AIS-Call-ID)})})
 same => n,ExecIf($["${AIS_CALL_ID}" = ""]?Set(AIS_CALL_ID=${UNIQUEID}))
 same => n,Return()

[ais-browser-group]
exten => 7771,1,Gosub(ais-browser-call-id,s,1)
 same => n,Set(AIS_LOCK=${LOCK(ais-call-${AIS_CALL_ID})})
 same => n,GotoIf($[${GROUP_COUNT(${AIS_CALL_ID}@ais-browser-call)} > 0]?duplicate)
 same => n,Set(GROUP(ais-browser-call)=${AIS_CALL_ID})
 same => n,Set(AIS_UNLOCK=${UNLOCK(ais-call-${AIS_CALL_ID})})
 same => n,Set(CDR(userfield)=ais:${AIS_CALL_ID}:group)
 same => n,Set(AIS_INDEX=7771)
 same => n,Set(AIS_TARGETS=)
 same => n,While($[${AIS_INDEX} <= 7780])
 same => n,Set(AIS_DEADLINE=${DB(ais-telephony/${AIS_INDEX}/active)})
 same => n,ExecIf($["${AIS_DEADLINE}" = ""]?Set(AIS_DEADLINE=0))
 same => n,ExecIf($[${AIS_DEADLINE} > ${EPOCH}]?Set(AIS_TARGETS=${AIS_TARGETS}&PJSIP/${AIS_INDEX}))
 same => n,Set(AIS_INDEX=$[${AIS_INDEX} + 1])
 same => n,EndWhile()
 same => n,GotoIf($["${AIS_TARGETS}" = ""]?unavailable)
 same => n,Dial(${AIS_TARGETS:1},120)
 same => n,Hangup()
 same => n(duplicate),Set(AIS_UNLOCK=${UNLOCK(ais-call-${AIS_CALL_ID})})
 same => n,Hangup(17)
 same => n(unavailable),Hangup(20)

[ais-browser-incoming]
exten => _XXXX,1,Gosub(ais-browser-call-id,s,1)
 same => n,Set(AIS_DEADLINE=${DB(ais-telephony/${EXTEN}/active)})
 same => n,ExecIf($["${AIS_DEADLINE}" = ""]?Set(AIS_DEADLINE=0))
 same => n,GotoIf($[${AIS_DEADLINE} <= ${EPOCH}]?unavailable)
 same => n,Set(CDR(userfield)=ais:${AIS_CALL_ID}:direct)
 same => n,Dial(PJSIP/${EXTEN},120)
 same => n,Hangup()
 same => n(unavailable),Hangup(20)

[ais-browser-outbound]
exten => 779,1,Gosub(ais-browser-permission,s,1(${CHANNEL(endpoint)}))
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _XXX,1,Gosub(ais-browser-route,s,1(${EXTEN}))
exten => _XXXX,1,Gosub(ais-browser-route,s,1(${EXTEN}))
exten => _7XXXXXXXXXX,1,Gosub(ais-browser-route,s,1(${EXTEN}))

[ais-browser-route]
exten => s,1,Set(AIS_EXTENSION=${CHANNEL(endpoint)})
 same => n,Gosub(ais-browser-permission,s,1(${AIS_EXTENSION}))
 same => n,Set(CALLERID(num)=${AIS_EXTENSION})
 same => n,Dial(PJSIP/${ARG1}@pbx-bridge,120)
 same => n,Return()

[ais-browser-permission]
exten => s,1,Set(AIS_DEADLINE=${DB(ais-telephony/${ARG1}/active)})
 same => n,ExecIf($["${AIS_DEADLINE}" = ""]?Set(AIS_DEADLINE=0))
 same => n,GotoIf($[${AIS_DEADLINE} <= ${EPOCH}]?blocked)
 same => n,Return()
 same => n(blocked),Hangup(21)
